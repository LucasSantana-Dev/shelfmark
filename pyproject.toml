[build-system]
requires = ["setuptools>=61,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlrecall"
version = "1.2.0"
description = "Agent memory and code recall in one SQLite file: hybrid BM25 + embeddings search, MCP server, no services. Formerly shelfmark."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Lucas Santana" }]
requires-python = ">=3.10"
keywords = ["rag", "retrieval", "semantic-search", "bm25", "embeddings", "mcp", "agent-memory", "hybrid-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6.0",
    "rank-bm25~=0.2",
    "sentence-transformers~=5.5",
]

[project.urls]
Homepage = "https://github.com/LucasSantana-Dev/sqlrecall"
Repository = "https://github.com/LucasSantana-Dev/sqlrecall"
Benchmark = "https://github.com/LucasSantana-Dev/sqlrecall/blob/main/BENCHMARK.md"

[project.scripts]
sqlrecall-build = "indexer:main"
sqlrecall-query = "query:main"
sqlrecall-mcp = "mcp_server:main"
sqlrecall-purge = "purge:main"
sqlrecall-hook = "capture:main"
# Pre-rename command names, kept so existing MCP configs and hooks keep working.
shelfmark-build = "indexer:main"
shelfmark-query = "query:main"
shelfmark-mcp = "mcp_server:main"
shelfmark-purge = "purge:main"

[tool.setuptools]
py-modules = [
    "indexer",
    "capture",
    "chunkers",
    "config",
    "diff_pack",
    "mcp_server",
    "pack",
    "populate_symbols",
    "purge",
    "query",
    "report",
    "retrieval",
    "session_chunker",
    "symbols",
]
