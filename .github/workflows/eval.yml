name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the embedding model (avoids HuggingFace 429 rate-limits)
        id: hfcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-multilingual-e5-small-v1
      - name: Create venv and install dependencies
        run: python3 -m venv venv && venv/bin/pip install -r requirements.txt
      - name: Build index
        env:
          HF_HUB_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: venv/bin/python build.py
      - name: Run eval gate (±5pp tolerance vs baseline)
        env:
          HF_HUB_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash eval/check.sh
      - name: Upload eval result JSONs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/*.json
          if-no-files-found: ignore
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache the embedding model (avoids HuggingFace 429 rate-limits)
        id: hfcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-multilingual-e5-small-v1
      - name: Create venv and install dependencies
        run: python3 -m venv venv && venv/bin/pip install -r requirements.txt
      - name: Unit tests — diff_pack retrieval
        env:
          HF_HUB_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: venv/bin/python diff_pack_test.py
      - name: Eval harness self-checks
        env:
          HF_HUB_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: venv/bin/python eval/test_harness.py
