name: Bug report
description: Something broke or behaves wrong
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get instead?
      placeholder: |
        Ran `shelfmark-query "..."` and got ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce. Include your sources.yaml shape if indexing-related (redact private paths).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show shelfmark` or commit SHA for a local checkout"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      render: shell
